# Top level styles
StylesPath = .vale/styles
MinAlertLevel = suggestion
IgnoredScopes = code, tt, img, url, a
# Do not add `code` here: listing both `pre` and `code` makes Vale toggle its
# skip state inside every <pre><code> block, so fenced code (and the frontmatter,
# which Vale wraps in a fence internally) gets linted as prose.
SkippedScopes = script, style, pre, figure

# Vocabularies
Vocab = Suga

# This is required since Vale doesn't officially support MDX
[formats]
mdx = md

# MDX support
[*.mdx]
BasedOnStyles = Vale
Vale.Terms = NO # Enforces really harsh capitalization rules, keep off

# `import ...`, `export ...`
# `<Component ... />`
# `<Component>...</Component>`
# `{ ... }`
TokenIgnores = (?sm)((?:import|export) .+?$), \
(?<!`)(<\w+ ?.+ ?\/>)(?!`), \
(<[A-Z]\w+>.+?<\/[A-Z]\w+>)

# Exclude:
# `<Component \n ... />`
# `{ ... }`
# YAML frontmatter at top of file
BlockIgnores = (?sm)^(<\w+\n .*\s\/>)$, \
(?sm)^({.+.*}), \
(?s)\A---\n.*?\n---\n

CommentDelimiters = {/*, */}